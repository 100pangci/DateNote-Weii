name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key when configured
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/date-note-release.jks"
          cat > "$HOME/.android/date-note-signing.properties" <<EOF
          storeFile=$HOME/.android/date-note-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Derive Android version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          base_version="${version%%-*}"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic versioning, for example v1.2.3"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$base_version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 0 )); then
            echo "Derived versionCode must be positive"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew -PversionName="$RELEASE_VERSION_NAME" -PversionCode="$RELEASE_VERSION_CODE" assembleRelease

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk "维来可期-${GITHUB_REF_NAME}.apk"

      - name: Prepare release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          awk -v version="$TAG_NAME" '
            /^## / {
              is_target = ($0 == "## " version || index($0, "## " version " ") == 1)
              if (is_target) {
                found = 1
              } else if (found) {
                exit
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "No changelog section found for $TAG_NAME"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: 维来可期-${{ github.ref_name }}.apk
          generate_release_notes: false
